<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaSoup Project 1</title>
  </head>
  <body>
    <div class="container">
      <!-- buttons -->
      <div id="step-by-step-buttons" class="">
          <button id="connect" class="">Init Connect</button>
          <button id="device" class="" disabled="disabled">Create & Load Device</button>
          <button id="create-producer" class="" disabled="disabled">Create Producer Transport</button>
          <button id="publish" class="" disabled="disabled">Publish feed</button>
          <button id="create-consumer" class="" disabled="disabled">Create Consumer Transport</button>
          <button id="consume" class="" disabled="disabled">Subscribe to feed</button>
          <button id="disconnect" class="" disabled="disabled">Disconnect</button>
      </div>
      <!-- video feed (if available) -->
      <div id="video-media" class="row">
        <div class="col-6">
          <h4>Local media</h4>
          <div id="local-media">
              <video id="local-video" autoplay inline class="vid"></video>
          </div>
        </div>
        <div class="col-6">
          <h4>Consuming media</h4>          
          <div id="remote-media">
            <video id="remote-video" autoplay inline class="vid"></video>
          </div>
        </div>
      </div>
      <!-- UI 相关元素 -->
      <script src="uiStuff.js"></script>
      <!-- 从服务器获取 socket.io -->
      <script src="https://localhost:3030/socket.io/socket.io.min.js"></script>
      <!-- mediasoup client -->
      <script src="mediasoup-client.min.js"></script>
      <!-- 业务逻辑 -->
      <script src="scripts.js"></script>
      <!-- UI 监听器 -->
      <script src="eventHandlers.js"></script>
  </div>
  </body>
</html>
